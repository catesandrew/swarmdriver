name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must come before `setup-node`: `cache: pnpm` needs the pnpm binary on
      # PATH to resolve the store directory. The version is taken from the
      # root `package.json` `packageManager` field, so it stays in lockstep
      # with local development.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      # Build must run before test: the workspace packages consume each other
      # through their published `exports` (`dist/`), so an unbuilt dependency
      # makes the cross-package tests fail to resolve.
      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
