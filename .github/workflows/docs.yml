name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest run needs to reach production; queued deploys of superseded
# commits are cancelled rather than racing each other onto Pages.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Job-level `permissions:` fully replaces the workflow-level block above
    # for this job, it does not merge with it - `configure-pages` needs
    # `pages: write` (and `id-token: write` for its enablement check), so
    # both have to be repeated here alongside `contents: read`.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must come before `setup-node`: `cache: pnpm` needs the pnpm binary on
      # PATH to resolve the store directory. The version is taken from the root
      # `package.json` `packageManager` field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeDoc runs with `entryPointStrategy: "packages"`, which resolves each
      # workspace package through its `exports` map. Those point at `dist/`, so
      # the packages have to be compiled before the API reference can be
      # generated.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Generate API reference
        run: pnpm build-docs

      - name: Build Docusaurus site
        run: pnpm --filter site build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
