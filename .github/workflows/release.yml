name: Release

# Manual trigger only: npm org scope + NPM_TOKEN have not been decided/configured
# yet, so this workflow must not auto-publish on every push to main. Once a
# scope is chosen and NPM_TOKEN is added as a repo secret, this can be
# switched to `on: push: branches: [main]` for the standard Changesets flow
# (see https://github.com/changesets/action#with-publishing).
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must come before `setup-node`, which needs the pnpm binary on PATH to
      # resolve the store directory for `cache: pnpm`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # TODO: uncomment once the npm org/scope is confirmed and NPM_TOKEN
          # is configured as a repository secret. Until then, changesets/action
          # will only open/update the "Version Packages" PR and will NOT
          # publish to npm (no publish command is wired below).
          #
          # In a pnpm workspace the publish command must be `pnpm publish -r`
          # (not `npm publish`) so every changed workspace package is published
          # and `workspace:*` protocol ranges are rewritten to real versions.
          # publish: pnpm publish -r --access public --no-git-checks
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
